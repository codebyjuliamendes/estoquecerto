name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: estoquecerto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test do container
        run: |
          docker run -d --name app -p 3002:3002 estoquecerto:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/api/health; then
              curl -fsS http://127.0.0.1:3002/api/summary > /dev/null
              curl -fsS http://127.0.0.1:3002/ | grep -q '<title>EstoqueCerto'
              test "$(docker exec app id -u)" != "0"
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
